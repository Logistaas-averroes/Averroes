# CI gate for the Averroes test suite.
#
# Added in PR-ADS-153D because the repository had no workflows at all, so no PR
# ever carried a check run or status context — every merge decision rested on a
# suite result pasted into a description by hand.
#
# Two known tests (tests/test_search_terms_followup_fixes.py, the two
# empty-search-term scheduler cases) fail on `main` in a sandboxed environment
# because they reach the Google Ads connector. They are DESELECTED from the
# blocking job — so a green check means "this branch introduced no failures" —
# and then run in a separate, clearly-labelled non-blocking job so their state
# stays visible instead of being quietly dropped.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    name: Test suite (excluding known-failing-on-main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the whitespace check below diffs against the base branch,
      # and actions/checkout fetches a single commit by default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile every touched package
        run: python -m compileall -q analysis api connectors db scheduler services scripts tests

      - name: Check static JS parses
        run: node --check static/app.js

      # Only the changes this PR introduces — the repository's pre-existing
      # whitespace is not this branch's to fix.
      - name: Check for whitespace errors in the diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"

      # PostgreSQL 16 ships on the ubuntu-latest image. The integration suite
      # spins up its own throwaway cluster as the unprivileged `postgres` user.
      - name: Confirm PostgreSQL server binaries are present
        run: |
          ls -d /usr/lib/postgresql/*/bin
          sudo -n -u postgres true

      - name: PostgreSQL integration tests (153D + 153E-A + 153E-A2 + 153E-B + 153F + 154A + 154B)
        run: |
          python -m pytest \
            tests/test_pr_ads_153d_pg_integration.py \
            tests/test_pr_ads_153e_a_pg_integration.py \
            tests/test_pr_ads_153e_a2_pg_integration.py \
            tests/test_pr_ads_153e_b_pg_integration.py \
            tests/test_pr_ads_153f_pg_integration.py \
            tests/test_pr_ads_154a_run_type_pg_integration.py \
            tests/test_pr_ads_154b_coverage_repair_pg.py -q \
            --junitxml=pg-results.xml

      # A skipped database suite is not merge evidence. If the cluster could not
      # start, the harness skips the whole module — which would otherwise look
      # like a pass. Fail loudly instead.
      - name: Assert the PostgreSQL tests actually ran
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("pg-results.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          # `classname` is the MODULE path for module-level test functions
          # (`tests.test_x`) and module+class for class-based ones
          # (`tests.test_x.TestY`). Match on the module prefix so both forms
          # count — stripping the last component assumed a class was always
          # present and collapsed every module to "tests".
          classnames = {c.get("classname", "") for c in suite.iter("testcase")}
          classnames.discard("")
          print(f"postgres tests={tests} skipped={skipped}")
          print("modules: " + ", ".join(sorted(classnames)))
          if tests == 0 or skipped:
              sys.exit("PostgreSQL integration tests did not run — a skipped "
                       "database suite is not acceptable merge evidence")
          # Naming a suite in the pytest invocation does not prove it RAN: a
          # module-level skipif silently contributes zero cases, and the count
          # above would still look healthy from the other suites.
          for required in ("tests.test_pr_ads_153d_pg_integration",
                           "tests.test_pr_ads_153e_a_pg_integration",
                           "tests.test_pr_ads_153e_a2_pg_integration",
                           "tests.test_pr_ads_153e_b_pg_integration",
                           "tests.test_pr_ads_153f_pg_integration",
                           "tests.test_pr_ads_154a_run_type_pg_integration",
                           "tests.test_pr_ads_154b_coverage_repair_pg"):
              if not any(cn == required or cn.startswith(required + ".")
                         for cn in classnames):
                  sys.exit(f"{required} contributed no test cases — it was "
                           "skipped or failed to collect, which is not "
                           "acceptable merge evidence")
          PY

      # The 153E-B contract suite is the CUTOVER guard: it fails CI if a
      # migrated consumer reaches for a retired legacy revenue table or
      # provider again, or stops reading the one shared canonical contract.
      - name: Contract tests (153D + 153E-A + 153E-A2 + 153E-B + 153F + 154 + 154B)
        run: |
          python -m pytest \
            tests/test_pr_ads_153d_waste_consolidation.py \
            tests/test_pr_ads_153e_a_revenue_ledger.py \
            tests/test_pr_ads_153e_a2_cutover_gate.py \
            tests/test_pr_ads_153e_b_consumer_cutover.py \
            tests/test_pr_ads_153f_country_geo_truth.py \
            tests/test_pr_ads_154_incremental_sync_hotfix.py \
            tests/test_daily_incremental_sync.py \
            tests/test_pr_ads_154b_truth_readiness.py \
            tests/test_pr_ads_129_roas_availability_geo_reconciliation.py -q

      - name: Full suite (known-failing-on-main deselected)
        run: |
          python -m pytest -q \
            --deselect "tests/test_search_terms_followup_fixes.py::test_daily_empty_search_terms_marks_success_not_success_empty" \
            --deselect "tests/test_search_terms_followup_fixes.py::test_weekly_empty_search_terms_marks_success_not_success_empty"

  known-failing:
    name: Known-failing on main (informational, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      # Informational ONLY. These reach the Google Ads connector and fail on
      # main too, so their result is reported in this log but never gates the
      # PR — a red check here would be indistinguishable from a real regression.
      # `continue-on-error` sits on the STEP so the job itself reports success
      # while the outcome stays visible.
      - name: Run the two tests that also fail on main
        continue-on-error: true
        run: |
          echo "These reach the Google Ads connector and fail on main in a"
          echo "sandboxed environment. Reported, not hidden — and NOT counted"
          echo "as evidence that this branch is green."
          python -m pytest tests/test_search_terms_followup_fixes.py -q
