# Decision Thresholds
# All classification thresholds live here — not in Python code

campaign_verdicts:
  scale:
    min_confirmed_sqls_30d: 1
    max_junk_pct: 15
    # Both conditions must be true

  fix:
    min_junk_pct: 25
    # OR
    zero_sqls_with_intent_mismatch: true
    # Intent mismatch = confirmed junk search terms present in this campaign's data

  cut:
    min_zero_sql_days: 60
    requires_confirmed_wrong_market: true
    # Both must be true — CUT is a serious verdict
    # Currently confirmed: venezuela

  hold:
    default: true
    # Anything not meeting SCALE or FIX or CUT criteria

lead_quality:
  junk_rate_denominator: "verdicted_contacts_only"
  # Exclude OPEN - Connecting from junk rate calculation
  # Only count contacts that MDR has made a verdict on

  small_sample_warning_threshold: 5
  # Campaigns with fewer than 5 contacts — flag as insufficient sample

  early_lead_grace_days: 7
  # Contacts created within 7 days — exclude from junk rate (MDR not had time to reach)

waste_detection:
  min_spend_to_flag: 5
  # Don't flag terms spending less than $5 total — not worth attention

  missing_search_terms_threshold: 60
  # If search term coverage is below 60% of expected volume, flag uncertainty

  min_contacts_to_validate_waste: 1
  # A term must have at least 1 HubSpot contact to be confirmed as waste
  # (otherwise it's suspected waste, not confirmed)

data_quality:
  ads_crm_delta_alert_pct: 20
  # If Google Ads conversions exceed HubSpot paid contacts by more than 20%,
  # flag as possible tracking issue or spam form fills

  gclid_coverage_warning_pct: 70
  # If fewer than 70% of paid contacts have a GCLID, flag the gap

reporting:
  analysis_window_days: 30
  daily_check_window_days: 2
  junk_spike_alert_threshold_pct: 20
  # Alert if junk rate in last 2 days is 20% above 7-day average

accounts:
  hubspot_id: "142257138"
  google_ads_id: "3059734490"
  report_email: "youssef.awwad@logistaas.com"
  timezone: "Asia/Amman"

# Venezuela is the only confirmed CUT market
# Do not add countries here without 60+ days of confirmed zero SQL data
confirmed_cut_markets:
  - venezuela

sync:
  daily_incremental:
    enabled: true
    schedule_hour: 9
    schedule_minute: 0
    timezone: Asia/Amman
    lookback_days:
      ads: 14
      hubspot_contacts: 14
      hubspot_deals: 30
      # PR-ADS-171A — Meta restates recent spend; every run re-reads this many
      # complete account days, ending yesterday in the Meta account's zone.
      meta_ads: 28

meta_ads:
  # PR-ADS-171A — the read-only Meta (Facebook/Instagram) Ads spend connector.
  # The Graph API version every Meta call is made against. v27.0 is the
  # version Meta named on 2026-11-22 when production called a deprecated one,
  # and the account and Insights reads then answered 200 on it. Meta retires
  # versions: when it does, the sync fails with `meta_api_version_deprecated`
  # and names the version to move to. META_API_VERSION (env) overrides this.
  # A value that is not `vNN.N` leaves the connector `misconfigured`.
  api_version: "v27.0"
  # Campaign rows per Insights page.
  page_limit: 500
  # Currencies the FX provider (ECB reference rates) publishes. Spend in any
  # other currency is stored and published in its own currency; its USD value
  # is unavailable (`fx_currency_not_supported`), never estimated.
  fx_provider_currencies: [AUD, BRL, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD,
                           HUF, IDR, ILS, INR, ISK, JPY, KRW, MXN, MYR, NOK,
                           NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD, ZAR]

contact_reconciliation:
  # PR-ADS-163C — the daily check that removes contacts deleted or merged away
  # in HubSpot (the modified-since contact sync never sees a deletion). It
  # runs inside the daily incremental sync, right after the contact sync.
  #
  # Safety valve: if the contacts that qualify for removal — ALL of them,
  # whichever run found them missing — number more than this, or more than
  # this share of the stored contacts, nothing is removed and the run is
  # recorded as `refused`. A mass disappearance is far more likely to be our
  # error or a HubSpot incident than the truth. A run that finds this many
  # contacts missing for the FIRST time is recorded `partial`.
  max_removals_per_run: 50
  max_removal_fraction: 0.01
  # A contact is removed only after HubSpot failed to return it on two checks
  # at least this many hours apart. The check runs daily, so: the second day.
  min_hours_between_strikes: 20
  # Cumulative limit. The removals of the last `removal_window_days` days plus
  # what a run would remove must stay within this many contacts AND this
  # share of the stored contacts, or the run removes nothing (`refused`). The
  # per-run limit alone would let a small persistent loss through every other
  # day without end.
  removal_window_days: 7
  max_removals_per_window: 100
  max_removal_window_fraction: 0.02

name_backfill:
  # PR-ADS-166A — the daily, read-only load of names from HubSpot, inside the
  # daily incremental sync.
  #
  # Contacts: the modified-since sync brings names for new and changed
  # contacts. The ones already stored are read by id, newest contact first,
  # at most this many per run (100 per HubSpot call, so 3000 = 30 calls).
  # About 21,700 stored contacts clear in roughly eight runs.
  max_contacts_per_run: 3000
  # Companies on a won deal: at most this many names read per run, never-read
  # first, then those last read more than `company_reread_days` ago.
  max_companies_per_run: 1000
  company_reread_days: 7
  # A contact HubSpot was asked for and did not return (deleted, merged,
  # invisible to the token) is asked again at most once in this many days.
  not_returned_retry_days: 7

# UI-safe display thresholds — consumed by GET /api/config/ui-thresholds
# These values drive frontend visual classification only.
# Do not change analysis thresholds above.
ui:
  junk_rate:
    low_pct: 15
    high_pct: 30
  spend:
    high_spend_usd: 100
  quality_score:
    strong_min: 8
    medium_min: 5
  freshness:
    stale_after_days: 2
  monitoring:
    stale_after_days:
      daily: 2
      # The incremental sync is its own cadence (PR-ADS-160-F2): it is a
      # different pipeline from the 06:00 pulse and gets its own verdict.
      daily_incremental_sync: 2
      # PR-ADS-165A: no `weekly` line — the weekly job is retired and is not a
      # monitoring cadence (api/monitoring.py RETIRED_RUN_TYPES).
      monthly: 35
    consecutive_failure_warning: 2

deal_ledger:
  # PR-ADS-161F — closed-won deals, customers and revenue publish only while
  # the last SUCCESSFUL incremental deal sync is at most this many hours old.
  # The sync runs daily; 36h tolerates one late run and catches a missed day.
  # A stopped scheduler otherwise leaves the last figures looking current.
  max_staleness_hours: 36

customer_identity:
  association_scan_max_age_hours: 48
  # PR-ADS-161D2 — an exact customer total publishes only while the latest
  # FULL deal→company association scan succeeded, covered every won deal, and
  # STARTED within this many hours (its start bounds its oldest observation; a
  # multi-day backfill's finish does not — PR-ADS-161D2-F2). The scan runs
  # daily; 48h tolerates one
  # missed run. Beyond it, totals are withheld (customer_identity_scan_not_current).

platform_certification:
  # PR-ADS-169A — the daily certification runs inside the 512Mi web instance
  # (idle ~297 MB). Each audit runs alone in a fresh interpreter and is
  # started only within the headroom that is free when it starts:
  #   budget = instance limit − instance usage now − safety_margin_mb
  # The limit is the cgroup's (v2 memory.max, else v1 limit_in_bytes) when it
  # is a number, else instance_memory_mb; the usage is the cgroup's
  # (memory.current / usage_in_bytes), else this process's own VmRSS. Below
  # min_audit_budget_mb the audit is not started (crashed, "insufficient
  # memory headroom"), never skipped. The parent reads the child's resident
  # memory every 0.25 s and kills it past the budget (crashed, "exceeded its
  # memory budget (N MB resident)"). Either makes the run NOT CERTIFIED.
  instance_memory_mb: 512
  safety_margin_mb: 64
  min_audit_budget_mb: 96
  # Address-space backstop (RLIMIT_AS, set by the child on itself) for a
  # spike faster than the watchdog. High on purpose: RLIMIT_AS also counts
  # reserved, never-touched mappings (~35 MB above resident here), and the
  # campaign_evidence child imports api.server (~97 MB of address space
  # before it reads a row). Measured peak on a production-sized dataset:
  # 131 MB of address space, 98 MB resident (docs/09 PR-ADS-169A).
  audit_address_space_mb: 320
  # Per audit. A run that exceeds it is killed and recorded crashed.
  audit_timeout_seconds: 900
  # The running row's heartbeat. A `running` row whose heartbeat is older
  # than interrupted_after_minutes is closed NOT CERTIFIED "heartbeat
  # stopped; presumed interrupted" (the cause is not observed).
  heartbeat_seconds: 60
  interrupted_after_minutes: 5
